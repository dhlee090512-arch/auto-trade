name: Bithumb AI AutoTrading Scheduler

on:
  #schedule:
    # 매 15분마다 자동 실행 (KST 기준 매시 00, 15, 30, 45분)
    #- cron: '*/15 * * * *'
  workflow_dispatch: # GitHub 웹 화면에서 [Run workflow] 버튼으로 수동 실행 가능

# 🔑 GitHub Actions 저장소 파일 수정/커밋 권한 부여 (필수)
permissions:
  contents: write

jobs:
  autotrade:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 저장소 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 필수 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyjwt requests pandas openai httpx

      # 4. 자동매매 스크립트 실행 (복기 추적 ➔ AI 스크리닝 ➔ 모의 매수)
      - name: Run Auto Trading Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          BITHUMB_API_KEY: ${{ secrets.BITHUMB_API_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_URL: ${{ secrets.WEBSHARE_URL }}
        run: python main.py

      # 5. 모의투자 내역(paper_trades.json) 업로드 과정 실시간 출력 및 커밋/푸시
      - name: Commit and Push Updated Trade History
        run: |
          echo "=========================================="
          echo "📤 [GitHub Repository 업로드 프로세스 시작]"
          echo "=========================================="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📂 변경된 매매 기록 파일 상태 확인 중..."
          git status --short
          
          git add paper_trades.json positions.json || true
          
          if git diff --staged --quiet; then
            echo "💡 변경된 매매 기록이 없어 GitHub 업로드를 건너뜁니다."
          else
            echo "📝 변경 사항 커밋 생성 중..."
            git commit -m "update: Paper trading history update [skip ci]"
            
            echo "🔄 최신 원격 저장소 동기화(pull --rebase) 중..."
            git pull --rebase origin main || true
            
            echo "🚀 GitHub 저장소로 paper_trades.json 푸시(push) 전송 중..."
            git push && echo "✅ [성공] GitHub 저장소에 paper_trades.json 업로드 완료!"
          fi
          echo "=========================================="
