name: Bithumb AI AutoTrading Scheduler

on:
  #schedule:
    # 매 30분마다 실행 (UTC 기준 0, 30분 -> KST 기준 매시 0, 30분)
    #- cron: '0,30 * * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행 버튼 제공

jobs:
  autotrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Trading Script
        env:
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          BITHUMB_API_KEY: ${{ secrets.BITHUMB_API_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_URL: ${{ secrets.WEBSHARE_URL }}
        run: python main.py

      - name: Commit and Push Updated Trade History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trades.json positions.json || true
          git commit -m "update: Auto-trade & Paper trading performance update [skip ci]" || true
          git push
