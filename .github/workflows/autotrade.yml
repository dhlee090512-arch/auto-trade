name: Bithumb AI AutoTrading Scheduler

on:
  #schedule:
    # 매 15분마다 자동 실행 (KST 기준 매시 00, 15, 30, 45분)
    #- cron: '*/15 * * * *'
  workflow_dispatch: # GitHub 웹 화면에서 [Run workflow] 수동 실행 지원

# 🔑 GitHub Actions 저장소 파일 수정/커밋 권한 부여
permissions:
  contents: write

jobs:
  autotrade:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 저장소 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필수 라이브러리 설치 (python-dotenv 추가)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyjwt requests pandas openai httpx python-dotenv

      # 4. 자동매매 스크립트 실행 (AI 스크리닝 ➔ 타점 산출 ➔ targets.json 생성)
      - name: Run Auto Trading Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          BITHUMB_API_KEY: ${{ secrets.BITHUMB_API_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_URL: ${{ secrets.WEBSHARE_URL }}
        run: python main.py

      # 5. 전략 타점(targets.json) 및 기록 파일 커밋/푸시
      - name: Commit and Push Updated Targets and History
        run: |
          echo "=========================================="
          echo "📤 [GitHub Repository 업로드 프로세스 시작]"
          echo "=========================================="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📂 변경된 전략 및 기록 파일 상태 확인 중..."
          git status --short
          
          # targets.json, paper_trades.json, positions.json 스테이징
          git add targets.json paper_trades.json positions.json || true
          
          if git diff --staged --quiet; then
            echo "💡 변경된 데이터가 없어 GitHub 업로드를 건너끡니다."
          else
            echo "📝 변경 사항 커밋 생성 중..."
            git commit -m "update: Sync trading targets and history [skip ci]"
            
            echo "🔄 최신 원격 저장소 동기화(pull --rebase) 중..."
            git pull --rebase origin main || true
            
            echo "🚀 GitHub 저장소로 푸시(push) 전송 중..."
            git push && echo "✅ [성공] GitHub 저장소에 targets.json 업로드 완료!"
          fi
          echo "=========================================="
